<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d6b38">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Integradores">
<title>Integradores</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box}html{background:#084c28}body{margin:0;padding:6px;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#0d6b38 0%,#084c28 100%);color:#222}.contenedor{width:100%;max-width:560px;margin:0 auto;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.25)}.cabecera{padding:7px 16px;text-align:center;background:linear-gradient(180deg,#fff 0%,#eef5f0 100%);border-bottom:4px solid #0d6b38}.logo{display:block;width:100%;max-width:185px;height:auto;margin:0 auto}.titulo{margin:-2px 0 0;font-size:28px;line-height:1;font-weight:900;color:#0d6b38}.subtitulo{margin-top:2px;font-size:15px;line-height:1.1;font-weight:700;color:#555}.contenido{padding:9px 15px 13px}.grupo{margin-bottom:7px}label{display:block;margin-bottom:3px;font-size:18px;line-height:1.05;font-weight:900}input{width:100%;height:58px;padding:6px 13px;font-size:29px;font-weight:900;color:#111;background:#fafafa;border:2px solid #b4c2b7;border-radius:13px}input:focus{outline:none;background:#fff;border-color:#0d6b38;box-shadow:0 0 0 3px rgba(13,107,56,.14)}input::placeholder{font-size:19px;font-weight:600;color:#aaa}.boton{width:100%;height:62px;margin-top:2px;border:0;border-radius:14px;background:linear-gradient(180deg,#15934e 0%,#0d6b38 100%);color:#fff;font-size:26px;font-weight:900;box-shadow:0 4px 12px rgba(13,107,56,.28)}.boton:active{transform:scale(.98)}#mensaje{min-height:26px;margin-top:10px;text-align:center;font-size:17px;font-weight:900}.ok{color:#0d6b38}.error{color:#c62828}.pendiente{color:#c77800}.estado{display:flex;justify-content:center;align-items:center;gap:7px;margin-top:7px;padding:8px;border-radius:12px;font-size:14px;font-weight:900;background:#f3f3f3}.punto{width:11px;height:11px;border-radius:50%}.online .punto{background:#15934e}.offline .punto{background:#d32f2f}.sincronizando .punto{background:#e69a00}.reloj{margin-top:10px;padding:8px;text-align:center;background:#eef5f0;border:1px solid #d3e1d6;border-radius:13px}#horaActual{font-size:28px;line-height:1;font-weight:900;letter-spacing:2px;color:#0d6b38}#fechaActual{margin-top:3px;font-size:13px;font-weight:700;color:#555}.pie{margin-top:5px;padding:5px;text-align:center;font-size:12px;font-weight:800;color:#777;user-select:none}.acerca{display:none;position:fixed;inset:0;padding:20px;align-items:center;justify-content:center;background:rgba(0,0,0,.9);z-index:99999}.acerca-contenido{width:100%;max-width:460px;padding:24px 20px;text-align:center;background:#050505;border:4px solid #ffe500;border-radius:22px}.acerca-titulo{margin-bottom:18px;font-size:29px;font-weight:900;color:#ffe500}.pacman-pista{position:relative;width:100%;height:88px;overflow:hidden;margin:10px 0 20px;background:#000;border-top:3px solid #193cff;border-bottom:3px solid #193cff}.bolitas{position:absolute;top:50%;left:15px;right:15px;height:12px;transform:translateY(-50%);background-image:radial-gradient(circle,#fff 0,#fff 4px,transparent 5px);background-size:32px 12px;background-repeat:repeat-x}.pacman{position:absolute;top:50%;left:-65px;width:54px;height:54px;transform:translateY(-50%);animation:caminarPacman 5s linear infinite}.pacman-arriba,.pacman-abajo{position:absolute;left:0;width:54px;height:27px;background:#ffe500}.pacman-arriba{top:0;border-radius:54px 54px 0 0;transform-origin:center bottom;animation:bocaArriba .22s infinite alternate}.pacman-abajo{bottom:0;border-radius:0 0 54px 54px;transform-origin:center top;animation:bocaAbajo .22s infinite alternate}.pacman-ojo{position:absolute;top:10px;left:29px;width:7px;height:7px;border-radius:50%;background:#111;z-index:5}@keyframes caminarPacman{0%{left:-65px}100%{left:calc(100% + 20px)}}@keyframes bocaArriba{from{transform:rotate(0)}to{transform:rotate(-38deg)}}@keyframes bocaAbajo{from{transform:rotate(0)}to{transform:rotate(38deg)}}.oa{font-size:27px;font-weight:900;letter-spacing:4px;color:#fff}.waka{margin-top:13px;font-size:17px;font-weight:900;color:#ffe500;animation:waka .55s infinite alternate}@keyframes waka{from{opacity:.5}to{opacity:1}}.cerrar-acerca{width:100%;height:58px;margin-top:22px;border:0;border-radius:12px;background:#ffe500;color:#111;font-size:20px;font-weight:900}
</style>
</head>
<body>
<div class="contenedor">
<div class="cabecera"><img class="logo" src="logo-masisa.png" alt="MASISA"><h1 class="titulo">Integradores</h1><div class="subtitulo">Registro de consumos</div></div>
<div class="contenido">
<div class="grupo"><label for="resina">Resina</label><input id="resina" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="Ingrese valor" autocomplete="off"></div>
<div class="grupo"><label for="secuestrante">Secuestrante</label><input id="secuestrante" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="Ingrese valor" autocomplete="off"></div>
<div class="grupo"><label for="f900">F900</label><input id="f900" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="Ingrese valor" autocomplete="off"></div>
<div class="grupo"><label for="emulsion1">Emulsión 1 Quimtec</label><input id="emulsion1" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="Ingrese valor" autocomplete="off"></div>
<div class="grupo"><label for="emulsion2">Emulsión 2 Quimtec</label><input id="emulsion2" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="Ingrese valor" autocomplete="off"></div>
<button id="botonGuardar" class="boton" onclick="guardarLocal()">GUARDAR</button>
<div id="mensaje"></div>
<div id="estadoConexion" class="estado online"><div class="punto"></div><span id="textoEstado">EN LÍNEA — Pendientes: 0</span></div>
<div class="reloj"><div id="horaActual">--:--:--</div><div id="fechaActual">Cargando fecha...</div></div>
<div class="pie" onclick="activarEasterEgg()">MASISA</div>
</div></div>
<div id="acercaDe" class="acerca"><div class="acerca-contenido"><div class="acerca-titulo">ACERCA DE</div><div class="pacman-pista"><div class="bolitas"></div><div class="pacman"><div class="pacman-arriba"></div><div class="pacman-abajo"></div><div class="pacman-ojo"></div></div></div><div class="oa">OA MMXXVI</div><div class="waka">WAKAWAKAWAKAWAKAWAKA</div><button class="cerrar-acerca" onclick="cerrarAcerca()">CERRAR</button></div></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbwN6KhBE2LSPOM9K1o8kKrH7_qCYsZ_YPVrPfcbMZTPE2k2pYIJ_Uc_uOZqC28xL9pZtQ/exec';
const CLAVE_COLA='integradores_cola_pwa_v1';let sincronizando=false;
function generarId(){return (window.crypto&&window.crypto.randomUUID)?window.crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
function leerCola(){try{return JSON.parse(localStorage.getItem(CLAVE_COLA)||'[]')}catch(e){return[]}}
function guardarCola(c){localStorage.setItem(CLAVE_COLA,JSON.stringify(c));actualizarEstado()}
function obtenerDatosFormulario(){return[{tipo:'RESINA',valor:document.getElementById('resina').value.trim()},{tipo:'SECUESTRANTE',valor:document.getElementById('secuestrante').value.trim()},{tipo:'F900',valor:document.getElementById('f900').value.trim()},{tipo:'EMULSION_1',valor:document.getElementById('emulsion1').value.trim()},{tipo:'EMULSION_2',valor:document.getElementById('emulsion2').value.trim()}].filter(d=>d.valor!=='')}
function limpiarFormulario(){['resina','secuestrante','f900','emulsion1','emulsion2'].forEach(id=>document.getElementById(id).value='')}
function mostrarMensaje(t,tipo){const m=document.getElementById('mensaje');m.textContent=t;m.className=tipo==='pendiente'?'pendiente':(tipo?'ok':'error')}
function guardarLocal(){const datos=obtenerDatosFormulario();if(!datos.length){mostrarMensaje('Debe ingresar al menos un valor.',false);return}if(datos.some(d=>!/^\d+$/.test(d.valor))){mostrarMensaje('Ingrese solamente números.',false);return}const lote={id:generarId(),fechaTelefono:new Date().toISOString(),datos};const cola=leerCola();cola.push(lote);guardarCola(cola);limpiarFormulario();if(navigator.onLine){mostrarMensaje('✓ Guardado. Sincronizando...',true);sincronizarPendientes()}else mostrarMensaje('✓ Guardado en el teléfono. Pendiente de sincronizar.','pendiente')}
function enviarJsonp(lote){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);const s=document.createElement('script');const timer=setTimeout(()=>{limpiar();reject(new Error('Tiempo de espera agotado'))},15000);function limpiar(){clearTimeout(timer);delete window[cb];s.remove()}window[cb]=r=>{limpiar();r&&r.ok?resolve(r):reject(new Error((r&&r.error)||'Respuesta inválida del servidor'))};s.onerror=()=>{limpiar();reject(new Error('No se pudo cargar la respuesta de Apps Script'))};s.src=API_URL+'?api=guardar&callback='+encodeURIComponent(cb)+'&lote='+encodeURIComponent(JSON.stringify(lote))+'&t='+Date.now();document.body.appendChild(s)})}
async function sincronizarPendientes(){if(sincronizando||!navigator.onLine)return;let cola=leerCola();if(!cola.length){actualizarEstado();return}sincronizando=true;actualizarEstado();const lote=cola[0];try{await enviarJsonp(lote);cola=leerCola().filter(x=>x.id!==lote.id);guardarCola(cola);sincronizando=false;if(cola.length){mostrarMensaje('Sincronizando '+cola.length+' pendiente(s)...',true);sincronizarPendientes()}else{mostrarMensaje('✓ Todo sincronizado',true);actualizarEstado()}}catch(e){sincronizando=false;mostrarMensaje('Error sincronización: '+e.message,'pendiente');actualizarEstado()}}
function actualizarEstado(){const n=leerCola().length;const cuadro=document.getElementById('estadoConexion');const texto=document.getElementById('textoEstado');if(sincronizando){cuadro.className='estado sincronizando';texto.textContent='SINCRONIZANDO — Pendientes: '+n}else if(navigator.onLine){cuadro.className='estado online';texto.textContent='EN LÍNEA — Pendientes: '+n}else{cuadro.className='estado offline';texto.textContent='SIN CONEXIÓN — Pendientes: '+n}}
function actualizarReloj(){const a=new Date();document.getElementById('horaActual').textContent=String(a.getHours()).padStart(2,'0')+':'+String(a.getMinutes()).padStart(2,'0')+':'+String(a.getSeconds()).padStart(2,'0');document.getElementById('fechaActual').textContent=a.toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
let contadorEasterEgg=0,tiempoUltimoToque=0;function activarEasterEgg(){const a=Date.now();if(a-tiempoUltimoToque>1500)contadorEasterEgg=0;tiempoUltimoToque=a;if(++contadorEasterEgg>=5){document.getElementById('acercaDe').style.display='flex';contadorEasterEgg=0}}function cerrarAcerca(){document.getElementById('acercaDe').style.display='none'}
window.addEventListener('online',()=>{actualizarEstado();mostrarMensaje('Conexión recuperada. Sincronizando...',true);sincronizarPendientes()});window.addEventListener('offline',()=>{actualizarEstado();mostrarMensaje('Sin conexión. Los datos quedarán guardados en el teléfono.','pendiente')});
window.addEventListener('load',()=>{actualizarReloj();setInterval(actualizarReloj,1000);setInterval(()=>{if(navigator.onLine&&leerCola().length&&!sincronizando)sincronizarPendientes()},10000);actualizarEstado();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');if(navigator.onLine)setTimeout(sincronizarPendientes,1200)});
</script>
</body>
</html>
